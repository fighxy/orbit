[workspace]
resolver = "3"
members = ["crates/orbit-core", "crates/orbit-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
jni = "0.22"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
zeroize = { version = "1.9", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
# Rust panics must be caught at the FFI boundary, so unwinding stays enabled.
panic = "unwind"

# Optimize dependencies in debug builds: Argon2 and AEAD code are otherwise
# slow enough to make passcode unlock in development builds take seconds.
[profile.dev.package."*"]
opt-level = 2
