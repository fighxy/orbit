[workspace]
resolver = "3"
members = ["crates/orbit-core", "crates/orbit-ffi", "crates/orbit-protocol", "crates/orbit-transport", "crates/orbit-cli", "services/orbit-node"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
orbit-core = { path = "crates/orbit-core" }
orbit-protocol = { path = "crates/orbit-protocol" }
orbit-transport = { path = "crates/orbit-transport" }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
base64 = "0.23"
blake3 = "1.8"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
ed25519-dalek = "3.0"
getrandom = "0.4"
hex = "0.4"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
jni = "0.22"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
postcard = { version = "1.1", features = ["use-std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false }
subtle = "2.6"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1.9", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
# Rust panics must be caught at the FFI boundary, so unwinding stays enabled.
panic = "unwind"

# Optimize dependencies in debug builds: Argon2 and AEAD code are otherwise
# slow enough to make passcode unlock in development builds take seconds.
[profile.dev.package."*"]
opt-level = 2
