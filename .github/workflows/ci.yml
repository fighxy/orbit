name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 29.0.14206865
  ANDROID_PLATFORM: platforms;android-37.0

jobs:
  rust:
    name: Rust core and FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated C header is up to date
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/orbit-ffi/cbindgen.toml --crate orbit-ffi --output crates/orbit-ffi/include/orbit.h
          git diff --exit-code crates/orbit-ffi/include
      - name: C ABI smoke test
        run: tools/ffi-smoke/run.sh

  jvm:
    name: Kotlin SDK, client and desktop (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:jvmTest :client:jvmTest :apps:desktop:compileKotlin --console=plain

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust Android targets and cargo-ndk
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM" "ndk;$NDK_VERSION" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :apps:android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-android-debug-apk
          path: apps/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    name: iOS framework (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :client:linkDebugFrameworkIosSimulatorArm64 :client:compileKotlinIosArm64 --console=plain
      - name: Xcode host app (simulator build)
        run: |
          brew install xcodegen
          cd apps/ios
          xcodegen generate
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/orbit-ios-build" CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/orbit-ios-build/Build/Products/Debug-iphonesimulator/Orbit.app" orbit-ios-simulator.zip
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-ios-simulator-app
          path: orbit-ios-simulator.zip
          if-no-files-found: error

  node-image:
    name: orbit-node Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f deploy/orbit-node/Dockerfile -t orbit-node .
      - name: Start container and wait for the node address
        run: |
          cat > orbit-node.toml <<'TOML'
          data_dir = "/var/lib/orbit-node"
          listen = ["0.0.0.0:7443"]
          [mailbox]
          registration_code = "ci-registration-code"
          TOML
          docker run -d --name orbit-node -p 7443:7443/udp \
            -v "$PWD/orbit-node.toml:/etc/orbit-node/orbit-node.toml:ro" orbit-node
          for i in $(seq 1 30); do
            if docker logs orbit-node 2>&1 | grep -q 'node address:'; then break; fi
            sleep 1
          done
          docker logs orbit-node
          ADDR=$(docker logs orbit-node 2>/dev/null | grep -o 'node address: .*' | cut -d' ' -f3 | sed 's/0.0.0.0/127.0.0.1/')
          test -n "$ADDR"
          docker exec orbit-node orbit-cli keygen /var/lib/orbit-node/test.key
          docker exec orbit-node orbit-cli register --node "$ADDR" --key /var/lib/orbit-node/test.key --code ci-registration-code
          docker stop orbit-node

  windows:
    name: Windows desktop (tests and MSI)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Rust tests (MSVC)
        run: cargo test --workspace --locked
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: SDK and client tests (real DLL, Windows Credential Manager)
        run: ./gradlew :shared:jvmTest :client:jvmTest --console=plain
      - name: MSI installer
        run: ./gradlew :apps:desktop:packageMsi -Porbit.cargoProfile=release --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: orbit-windows-msi
          path: apps/desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
