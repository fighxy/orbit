name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 29.0.14206865
  ANDROID_PLATFORM: platforms;android-37.0

jobs:
  rust:
    name: Rust core and FFI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated C header is up to date
        run: |
          cargo install cbindgen --version 0.29.4 --locked
          cbindgen --config crates/orbit-ffi/cbindgen.toml --crate orbit-ffi --output crates/orbit-ffi/include/orbit.h
          git diff --exit-code crates/orbit-ffi/include
      - name: C ABI smoke test
        run: tools/ffi-smoke/run.sh

  jvm:
    name: Kotlin SDK, client and desktop (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :shared:jvmTest :client:jvmTest :apps:desktop:compileKotlin --console=plain

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust Android targets and cargo-ndk
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_PLATFORM" "ndk;$NDK_VERSION" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :apps:android:assembleDebug --console=plain

  ios:
    name: iOS framework (simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rust iOS targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :client:linkDebugFrameworkIosSimulatorArm64 :client:compileKotlinIosArm64 --console=plain
