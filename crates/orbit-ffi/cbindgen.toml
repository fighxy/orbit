# Regenerate with: cbindgen --config crates/orbit-ffi/cbindgen.toml --crate orbit-ffi --output crates/orbit-ffi/include/orbit.h
# CI fails when the committed header differs from the generated one.
language = "C"
include_guard = "ORBIT_H"
autogen_warning = "/* Generated by cbindgen from crates/orbit-ffi. Do not edit by hand. */"
include_version = false
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["OrbitBuffer"]

[parse]
parse_deps = false
