# Xcode host for the Compose UI in the OrbitClient framework (built by Gradle).
# Generate the project with `xcodegen generate` in this directory.
name: Orbit
options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - Orbit
    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # Compose Multiplatform renders at the display's full refresh rate.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbit.messenger
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../../client/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "OrbitClient"]
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :client:embedAndSignAppleFrameworkForXcode
